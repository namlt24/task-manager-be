name: CI + Deploy

# Builds/tests on a GitHub-hosted runner, then deploys to the laptop (self-hosted runner)
# by pulling both repos and rebuilding the Docker Compose stack.
on:
  push:
    branches: [master]
  repository_dispatch:        # fired by task-manager-fe when its master changes
    types: [deploy]
  workflow_dispatch:          # manual "Run workflow" button

# Serialize deploys so two pushes (or a be-push + an fe-dispatch) never overlap.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  build:
    name: Build & test (backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: mvn verify
        run: mvn -B -ntp verify

  deploy:
    name: Deploy to laptop
    needs: build
    runs-on: self-hosted
    env:
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}   # optional repo Variable; defaults to ~/task-manager
    steps:
      - name: Pull latest code (both repos) and redeploy
        shell: bash
        run: |
          set -euo pipefail
          DIR="${DEPLOY_DIR:-$HOME/task-manager}"
          echo "Deploy dir: $DIR"
          for r in task-manager-be task-manager-fe; do
            echo "==> updating $r"
            git -C "$DIR/$r" fetch --prune origin master
            git -C "$DIR/$r" reset --hard origin/master
          done
          cd "$DIR/task-manager-be"
          docker compose up -d --build
          docker image prune -f
          docker compose ps
