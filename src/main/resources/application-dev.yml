spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/taskmanager}
    username: ${DB_USERNAME:taskmanager}
    password: ${DB_PASSWORD:taskmanager}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jpa:
    properties:
      hibernate:
        format_sql: true
    show-sql: true
  # SMTP for password-reset / notification emails in dev.
  # Provide credentials via env vars (never commit real secrets):
  #   MAIL_HOST / MAIL_PORT / MAIL_USERNAME / MAIL_PASSWORD / MAIL_FROM
  # For Gmail use an App Password (16 chars, 2FA on); a normal password fails with 535.
  # With no env set it defaults to a local SMTP sink (e.g. Mailpit on localhost:1025).
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
        transport:
          protocol: smtp
    default-encoding: UTF-8

app:
  mail:
    from: ${MAIL_FROM:no-reply@taskmanager.local}

logging:
  level:
    com.taskmanager: DEBUG
    org.springframework.security: INFO
