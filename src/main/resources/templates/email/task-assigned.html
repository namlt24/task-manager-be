<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Bạn được giao việc</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f5f7;font-family:Segoe UI,Roboto,Helvetica,Arial,sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f5f7;padding:32px 0;">
        <tr>
            <td align="center">
                <table role="presentation" width="480" cellpadding="0" cellspacing="0"
                       style="background-color:#ffffff;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.06);">
                    <tr>
                        <td style="background-color:#26a69a;padding:24px 32px;">
                            <h1 style="margin:0;color:#ffffff;font-size:20px;">Task Manager</h1>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:32px;">
                            <p style="margin:0 0 16px;font-size:15px;color:#111827;">
                                Xin chào <strong th:text="${fullName}">bạn</strong>,
                            </p>
                            <p style="margin:0 0 16px;font-size:15px;color:#374151;line-height:1.6;"
                               th:text="${message}">Bạn vừa được giao một công việc mới.</p>
                            <div style="margin:20px 0;padding:14px 18px;background-color:#e0f2f1;border-radius:10px;">
                                <span style="font-size:16px;font-weight:700;color:#00897b;" th:text="${taskTitle}">Tên công việc</span>
                            </div>
                            <p style="margin:0;font-size:13px;color:#9ca3af;line-height:1.6;">
                                Đăng nhập Task Manager và mở mục &laquo;Việc của tôi&raquo; để xem chi tiết.
                            </p>
                        </td>
                    </tr>
                    <tr>
                        <td style="background-color:#f9fafb;padding:16px 32px;border-top:1px solid #eef0f3;">
                            <p style="margin:0;font-size:12px;color:#9ca3af;">
                                Email tự động từ Task Manager — vui lòng không trả lời.
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
